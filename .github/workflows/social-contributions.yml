name: Refresh social contributions chart

# Render + automatable RSS pull. Keeps social-contributions.svg current. The generator always
# renders the trailing 365 days ending "today", so re-running it rolls the window forward
# exactly like GitHub's own contribution graph (which also only advances once per day).
#
# This workflow holds NO Microsoft credentials and never logs into any account. It only:
#   1. pulls any configured PUBLIC blog RSS feeds (social-contributions/feeds.txt) and appends
#      new blog posts to the committed data file, and
#   2. re-renders the SVG.
# Your LinkedIn/X history comes from your own official data exports, imported locally and
# pushed by social-contributions/publish.py (the "push model").
#
#   * schedule  -> pulls RSS + rolls the window even when nothing else changed
#   * push      -> when publish.py updates the data file, re-render immediately
#   * dispatch  -> manual "Run workflow" button

on:
  schedule:
    # Every 6 hours (UTC). Guarantees the day rolls over within hours of local midnight
    # for any timezone.
    - cron: "9 */6 * * *"
  push:
    branches: [main]
    paths:
      - "social-contributions/data/**"
      - "social-contributions/generate.py"
      - ".github/workflows/social-contributions.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-contributions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Render "today" in Amanda's timezone so the window rolls at local midnight.
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Import blog RSS (public feeds only)
        env:
          RSS_AUTHOR: ${{ vars.RSS_AUTHOR }}
        run: |
          feeds=()
          while IFS= read -r line; do
            line="${line%%$'\r'}"
            case "$line" in ''|'#'*) continue ;; esac
            feeds+=("$line")
          done < social-contributions/feeds.txt
          if [ ${#feeds[@]} -eq 0 ]; then
            echo "No feeds configured in social-contributions/feeds.txt; skipping RSS import."
            exit 0
          fi
          extra=()
          if [ -n "$RSS_AUTHOR" ]; then extra+=(--author "$RSS_AUTHOR"); fi
          python social-contributions/import_blog_rss.py "${feeds[@]}" "${extra[@]}" \
            --out social-contributions/data/social-posts.jsonl

      - name: Generate SVG
        run: python social-contributions/generate.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-contributions/social-contributions.svg social-contributions/data/social-posts.jsonl
          if git diff --cached --quiet; then
            echo "Chart and data already up to date."
          else
            git commit -m "chore: refresh social contributions chart [skip ci]"
            git push
          fi
